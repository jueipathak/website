<style>
    /* Center the collection and wrap the items */
    .book-collection {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        padding: 30px 10px;
        max-width: 1200px;
        margin: 0 auto;
    }
    .book-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 250px; /* Standard width for a cover */
        text-align: center;
        text-decoration: none; /* Remove link underline */
        color: #333;
        transition: transform 0.2s;
    }
    .book-item:hover {
        transform: translateY(-5px); /* Lift effect on hover */
        box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    
    /* Style for the actual flipbook cover thumbnail */
    ._df_thumb {
        width: 100%;
        height: 350px; /* Set a consistent height for all covers */
        background-size: cover;
        background-position: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        border-radius: 8px;
        margin-bottom: 15px;
        cursor: pointer;
    }
    
    .book-title {
        font-family: Arial, sans-serif;
        font-size: 1.1em;
        font-weight: 600;
        padding: 0 5px;
    }
    h1 {
        text-align: center;
        font-family: 'Georgia', serif;
        margin-bottom: 20px;
    }

    .story-preview-modal {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.72);
        z-index: 1000;
        padding: 24px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
    }

    .story-preview-modal.is-open {
        opacity: 1;
        pointer-events: auto;
    }

    .story-preview-panel {
        width: min(980px, 100%);
        background: #fff;
        border-radius: 12px;
        position: relative;
        padding: 24px;
        box-shadow: 0 20px 80px rgba(0,0,0,0.45);
    }

    .story-preview-header h2 {
        margin: 0 0 16px;
        font-size: 1.25rem;
    }

    .story-preview-body {
        min-height: min(720px, 80vh);
    }

    #story-preview-frame {
        width: 100%;
        min-height: min(720px, 78vh);
        border: 0;
        background: #eee;
    }

    .story-preview-close {
        position: absolute;
        top: 12px;
        right: 12px;
        border: 0;
        background: #eee;
        color: #222;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 28px;
        line-height: 1;
    }

    @media (max-width: 640px) {
        .story-preview-panel {
            padding: 16px;
        }

        .story-preview-body {
            min-height: 500px;
        }

        #story-preview-frame {
            min-height: 500px;
        }
    }
</style>

<h1>Children's Stories</h1>

<div class="book-collection">
    
    <a class="book-item" href="javascript:void(0)">
        <div 
            class="_df_thumb lazy-story-thumb"
            data-pdf="./books/Junglat-Kay-Challay.pdf"
            data-thumb="./books/Junglat Kay Challay.jpg"
            data-title="Junglat Kay Challay?">
        </div>
        <div class="book-title">Junglat Kay Challay?</div>
    </a>
</div>

<div id="story-preview-modal" class="story-preview-modal" aria-hidden="true">
    <div class="story-preview-panel">
        <button id="story-preview-close" class="story-preview-close" aria-label="Close preview">×</button>
        <div class="story-preview-header">
            <h2 id="story-preview-title">Story Preview</h2>
        </div>
        <div class="story-preview-body">
            <iframe id="story-preview-frame" title="Story PDF preview" loading="lazy"></iframe>
        </div>
    </div>
</div>

<script>
(function () {
  const modal = document.getElementById('story-preview-modal');
  const frame = document.getElementById('story-preview-frame');
  const title = document.getElementById('story-preview-title');
  const closeBtn = document.getElementById('story-preview-close');

  document.querySelectorAll('._df_thumb.lazy-story-thumb').forEach(function (thumb) {
    const cover = thumb.dataset.thumb;
    if (cover) {
      thumb.style.backgroundImage = 'url("' + cover + '")';
    }
  });

  function openPreview(bookItem) {
    const thumb = bookItem.querySelector('._df_thumb.lazy-story-thumb');
    const pdf = thumb && thumb.dataset.pdf;
    const pdfTitle = thumb && thumb.dataset.title;

    if (!pdf) {
      return;
    }

    title.textContent = pdfTitle || 'Story Preview';
    frame.src = pdf;
    modal.classList.add('is-open');
    modal.setAttribute('aria-hidden', 'false');
  }

  function closePreview() {
    modal.classList.remove('is-open');
    modal.setAttribute('aria-hidden', 'true');
    frame.src = '';
  }

  document.querySelectorAll('.book-item').forEach(function (bookItem) {
    bookItem.addEventListener('click', function (event) {
      event.preventDefault();
      openPreview(bookItem);
    });
  });

  closeBtn.addEventListener('click', closePreview);
  modal.addEventListener('click', function (event) {
    if (event.target === modal) {
      closePreview();
    }
  });
})();
</script>
